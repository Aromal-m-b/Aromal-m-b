name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: Aromal-m-b
          outputs: |
            dist/github-snake.svg?color_snake=%23ffb128&color_dots=%23efece4,%23f7dfb0,%23f2c876,%23e7a73e,%23bc7411
            dist/github-snake-dark.svg?palette=github-dark&color_snake=%23ffb128&color_dots=%231a1917,%23453018,%2380531e,%23bd7924,%23ffb128

      - name: Publish SVGs to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
